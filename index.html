<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hollow Crown</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050407;font-family:Inter,system-ui,sans-serif;color:#e8e2d6;user-select:none}
canvas{display:block}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;z-index:20;background:radial-gradient(ellipse at center,rgba(40,18,14,.86),rgba(5,4,7,.97) 70%);overflow-y:auto;padding:24px 0}
h1{font-family:Cinzel,serif;font-weight:900;font-size:clamp(40px,7vw,84px);letter-spacing:.12em;color:#d9c39a;text-shadow:0 0 30px rgba(255,90,40,.35),0 4px 0 #000}
h2{font-family:Cinzel,serif;font-weight:700;font-size:clamp(28px,4vw,44px);letter-spacing:.12em;color:#d9c39a;text-shadow:0 3px 0 #000}
.sub{font-family:Cinzel,serif;letter-spacing:.3em;text-transform:uppercase;color:#a8977a;font-size:14px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.lbl{font-family:Cinzel,serif;letter-spacing:.15em;color:#a8977a;font-size:13px;text-transform:uppercase}
input,select{font-family:Inter,sans-serif;font-size:14px;padding:9px 12px;background:#140f0c;color:#eadcc0;border:1px solid #4a3d2e;border-radius:4px;outline:none}
input:focus,select:focus{border-color:#d9a74a}
input.code{text-transform:uppercase;letter-spacing:.3em;width:130px;text-align:center;font-family:Cinzel,serif;font-weight:700}
.cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.card{width:220px;padding:18px 16px;border:1px solid #4a3d2e;background:linear-gradient(180deg,rgba(30,24,20,.9),rgba(14,11,10,.95));border-radius:6px;text-align:center;cursor:pointer;transition:.2s}
.card:hover{border-color:#8a6a3a}
.card svg{width:56px;height:56px;margin-bottom:8px}
.card h3{font-family:Cinzel,serif;font-size:19px;letter-spacing:.08em;color:#e9d6ae;margin-bottom:6px}
.card p{font-size:12.5px;line-height:1.5;color:#b5a991;min-height:56px}
.card .tag{display:inline-block;margin-top:10px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;padding:4px 10px;border-radius:3px;background:#3c2b18;color:#e6c27a}
.card.sel{border-color:#d9a74a;box-shadow:0 0 0 1px #d9a74a,0 0 30px rgba(217,167,74,.25)}
.classInfo{max-width:760px;text-align:center;font-size:12.5px;line-height:1.8;color:#9c907a;padding:0 16px;min-height:44px}
.classInfo b{color:#cdb88f}
button.big{font-family:Cinzel,serif;font-size:16px;letter-spacing:.14em;padding:12px 30px;background:linear-gradient(180deg,#7a2a18,#4a140b);color:#f3dcb4;border:1px solid #c0703a;border-radius:4px;cursor:pointer;transition:.15s}
button.big:hover{filter:brightness(1.25);transform:translateY(-1px)}
button.big:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
button.alt{background:linear-gradient(180deg,#2c2620,#17130f);border-color:#5a4a36}
button.sm{font-size:12px;padding:5px 12px;background:#2a221a;color:#e3cfa6;border:1px solid #5a4a36;border-radius:3px;cursor:pointer;font-family:Inter,sans-serif}
button.sm:hover{filter:brightness(1.3)}
.status{min-height:20px;font-size:13px;color:#e08a6a;letter-spacing:.04em;text-align:center;max-width:600px}
.panel{padding:18px 20px;border:1px solid #4a3d2e;background:rgba(14,11,10,.88);border-radius:6px;min-width:min(340px,92vw)}
.panel.wide{width:min(560px,92vw)}
.panelTitle{font-family:Cinzel,serif;letter-spacing:.12em;color:#e3cfa6;font-size:15px;margin-bottom:10px}
.field{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:8px 0}
.field label{font-size:13px;color:#b5a991;letter-spacing:.06em}
.field select{min-width:200px}
.desc{font-size:12.5px;color:#9c907a;line-height:1.6;margin-top:10px;max-width:420px}
.mpRow{display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.chk{font-size:13px;color:#b5a991;display:flex;align-items:center;gap:6px;cursor:pointer}
.listHead{display:flex;justify-content:space-between;align-items:center;font-family:Cinzel,serif;letter-spacing:.1em;color:#e3cfa6;margin:6px 0 8px;border-top:1px solid #33291f;padding-top:12px}
.lobbyList{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.lobbyItem{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#1a1410;border:1px solid #33291f;border-radius:4px;font-size:13px}
.lobbyItem .meta{color:#9c907a;font-size:12px}
.empty{font-size:13px;color:#7a705e;padding:10px 0}
.codeShow{font-size:.8em;letter-spacing:.3em;color:#f2c75a;margin-left:10px;padding:2px 12px;border:1px solid #6a5030;border-radius:4px;background:#1a1208}
.lobbyWrap{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.slot{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid #33291f;border-radius:4px;margin-bottom:6px;background:#17120e;min-width:290px}
.slot.emptySlot{opacity:.35}
.slot .nm{flex:1;font-size:14px}
.slot .cls{font-size:12px;color:#b5a991;letter-spacing:.08em}
.slot .rdy{font-size:11px;letter-spacing:.15em;text-transform:uppercase;padding:3px 8px;border-radius:3px;background:#2a221a;color:#7a705e}
.slot .rdy.on{background:#24401f;color:#9fe08a}
.slot .crown{color:#f2c75a;font-size:11px;letter-spacing:.15em}
.clsBtns{display:flex;gap:8px}
.clsBtns button{flex:1}
.clsBtns button.on{border-color:#d9a74a;background:#3c2b18}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.pbars{position:absolute;left:28px;top:22px;width:min(340px,58vw)}
.pname{font-family:Cinzel,serif;font-size:14px;letter-spacing:.1em;color:#e3cfa6;margin-bottom:6px;text-shadow:0 2px 3px #000}
.bar{height:14px;background:rgba(0,0,0,.6);border:1px solid #3b3128;margin-bottom:6px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block}
.bar span{position:absolute;right:6px;top:-1px;font-size:10.5px;color:#f3e6c8;text-shadow:0 1px 2px #000}
#hpChip{background:#e8d9b0}
#hpFill{background:linear-gradient(180deg,#c43a2a,#7c1a12)}
.bar.mana{height:11px;width:85%}
#manaFill{background:linear-gradient(180deg,#4a7ae8,#1e3a9a)}
.flasks{display:flex;gap:6px;margin-top:6px;align-items:center;font-size:12px;color:#c9b88f;letter-spacing:.1em}
.flask{width:13px;height:19px;border-radius:3px 3px 6px 6px;background:linear-gradient(180deg,#f2c75a,#b5781c);box-shadow:0 0 8px rgba(242,199,90,.5)}
.flask.empty{background:#2a241c;box-shadow:none}
#buffs{margin-top:6px;font-size:12px;color:#9fd8ff;letter-spacing:.1em;min-height:16px}
#team{position:absolute;left:28px;top:150px;width:220px}
.tm{margin-bottom:8px;font-size:12px;color:#d8ccb0;text-shadow:0 1px 2px #000}
.tm .tb{height:6px;background:rgba(0,0,0,.6);border:1px solid #3b3128;margin-top:3px;position:relative}
.tm .tb i{position:absolute;left:0;top:0;bottom:0;background:#b8352a}
.tm.dead{opacity:.45}
.tm.dead .tb i{background:#444}
.boss{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:min(720px,70vw)}
.boss .name{font-family:Cinzel,serif;font-size:17px;letter-spacing:.12em;color:#e3cfa6;margin-bottom:6px;text-shadow:0 2px 4px #000}
.boss .bar{height:12px}
#bChip{background:#e8c66a}
#bFill{background:linear-gradient(180deg,#a8261a,#5c0f09)}
#lockTag{position:absolute;right:28px;top:22px;font-size:12px;letter-spacing:.2em;color:#b8a57d;text-transform:uppercase;text-align:right;line-height:1.8}
#specTag{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-family:Cinzel,serif;letter-spacing:.15em;color:#e3cfa6;font-size:15px;text-align:center;text-shadow:0 2px 3px #000}
#specTag small{display:block;font-family:Inter,sans-serif;font-size:11.5px;color:#a99878;letter-spacing:.08em;margin-top:4px}
#skills{position:absolute;left:50%;transform:translateX(-50%);bottom:92px;display:flex;gap:8px}
.sk{width:62px;height:62px;border:1px solid #5a4a36;background:rgba(14,11,10,.85);border-radius:6px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.sk .nm{font-size:9.5px;color:#d8ccb0;line-height:1.15;padding:0 3px;position:relative;z-index:2}
.sk .key{position:absolute;top:2px;left:4px;font-size:9.5px;font-weight:600;color:#f2c75a;z-index:2}
.sk .cost{position:absolute;bottom:2px;right:4px;font-size:9px;color:#8fb0ff;z-index:2}
.sk .cdv{position:absolute;inset:0;z-index:1}
.sk .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#fff;z-index:3;text-shadow:0 1px 3px #000}
.sk.nomana{border-color:#3a4a8a}
.sk.nomana .nm{color:#6a7aaa}
#chargeWrap{position:fixed;left:50%;top:calc(50% + 34px);width:120px;height:6px;margin-left:-60px;background:rgba(0,0,0,.6);border:1px solid #5a4a36;z-index:6;pointer-events:none}
#chargeFill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#c9a04a,#fff2b0);display:block}
#tags{position:fixed;inset:0;pointer-events:none;z-index:4}
.ntag{position:absolute;left:0;top:0;font-size:12px;color:#f3e6c8;text-shadow:0 1px 3px #000;white-space:nowrap;text-align:center}
.ntag .hb{width:60px;height:4px;background:rgba(0,0,0,.6);margin:3px auto 0;position:relative}
.ntag .hb i{position:absolute;left:0;top:0;bottom:0;background:#c43a2a}
#center{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font-family:Cinzel,serif;text-align:center;z-index:6;pointer-events:none;opacity:0;transition:opacity .4s;width:90vw}
#center .t{font-size:clamp(26px,4.2vw,50px);letter-spacing:.14em;color:#e2c48a;text-shadow:0 0 24px rgba(255,80,30,.4),0 3px 0 #000}
#center .s{font-size:14px;letter-spacing:.22em;color:#a99878;margin-top:8px;text-transform:uppercase}
#toast{position:fixed;left:50%;top:calc(50% + 60px);transform:translateX(-50%);font-size:13px;color:#ffb08a;letter-spacing:.08em;z-index:7;pointer-events:none;opacity:0;transition:opacity .25s;text-shadow:0 1px 3px #000}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 180px rgba(0,0,0,.85)}
#hurtFx{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 40%,rgba(160,0,0,.55));opacity:0}
.ft{position:fixed;left:0;top:0;z-index:7;pointer-events:none;font-family:Cinzel,serif;font-weight:700;font-size:20px;color:#f3e0b0;text-shadow:0 2px 3px #000}
.ft.big{font-size:28px;color:#ffd36a}
.ft.label{font-size:22px;color:#9fd8ff;letter-spacing:.15em}
.ft.heal{color:#8af0a0;font-size:22px}
#end h1{font-size:clamp(36px,6vw,72px)}
#end.dead h1{color:#b3261a;text-shadow:0 0 30px rgba(180,20,10,.6),0 4px 0 #000}
#endStats{font-size:14px;color:#b5a991;letter-spacing:.08em;line-height:1.9;text-align:center}
.ctrlTable{display:grid;grid-template-columns:1fr;gap:4px;min-width:min(480px,92vw);padding:14px 22px;border:1px solid #4a3d2e;background:rgba(14,11,10,.85);border-radius:6px}
.ctrlTable div{display:flex;justify-content:space-between;gap:24px;font-size:13.5px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.ctrlTable div:last-child{border-bottom:none}
.ctrlTable b{font-family:Cinzel,serif;color:#e3cfa6;font-weight:700;letter-spacing:.05em}
.ctrlTable span{color:#b5a991;text-align:right}
.ctrlTable div{align-items:center}
.bindBtn{min-width:130px;padding:6px 12px}
.bindBtn.on{border-color:#d9a74a;background:#3c2b18;color:#f2c75a}
#crosshair{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,230,190,.45);z-index:5;pointer-events:none}
</style>
</head>
<body>
<div id="menu" class="screen">
  <h1>HOLLOW CROWN</h1>
  <div class="row"><span class="lbl">Name</span><input id="nameIn" maxlength="16" placeholder="Adventurer"></div>
  <div class="sub">Select Your Class</div>
  <div class="cards" id="classCards"></div>
  <div class="classInfo" id="classInfo"></div>
  <div class="row"><button class="big" id="soloBtn">Play Solo</button><button class="big alt" id="mpBtn">Multiplayer</button><button class="big alt" id="menuBindsBtn">Keybinds</button></div>
  <div class="status" id="menuStatus"></div>
</div>

<div id="solo" class="screen hidden">
  <h2>Solo Expedition</h2>
  <div class="panel">
    <div class="field"><label>Boss</label><select id="soloBoss"></select></div>
    <div class="field"><label>Arena</label><select id="soloArena"></select></div>
    <div class="field"><label>Difficulty</label><select id="soloDiff"></select></div>
    <div class="desc" id="soloDesc"></div>
  </div>
  <div class="row"><button class="big" id="soloStart">Begin</button><button class="big alt" id="soloBack">Back</button></div>
</div>

<div id="mp" class="screen hidden">
  <h2>Multiplayer</h2>
  <div class="panel wide">
    <div class="mpRow"><button class="big" id="createBtn">Create Lobby</button><label class="chk"><input type="checkbox" id="pubChk" checked> Public lobby</label></div>
    <div class="mpRow"><input id="codeIn" class="code" maxlength="5" placeholder="CODE"><button class="big alt" id="joinBtn">Join by Code</button></div>
    <div class="listHead"><span>Open Lobbies</span><button class="sm" id="refreshBtn">Refresh</button></div>
    <div id="lobbyList" class="lobbyList"></div>
  </div>
  <div class="status" id="mpStatus"></div>
  <button class="big alt" id="mpBack">Back</button>
</div>

<div id="lobby" class="screen hidden">
  <h2>Lobby<span id="lobbyCode" class="codeShow"></span></h2>
  <div class="lobbyWrap">
    <div class="panel"><div class="panelTitle">Party (<span id="pCount">1</span>/5)</div><div id="slots"></div></div>
    <div class="panel">
      <div class="panelTitle">Your Class</div>
      <div id="lobbyClasses" class="clsBtns"></div>
      <div class="panelTitle" style="margin-top:16px">Expedition Settings</div>
      <div class="field"><label>Boss</label><select id="lBoss"></select></div>
      <div class="field"><label>Arena</label><select id="lArena"></select></div>
      <div class="field"><label>Difficulty</label><select id="lDiff"></select></div>
      <div class="desc" id="lobbyNote"></div>
    </div>
  </div>
  <div class="row"><button class="big" id="readyBtn">Ready</button><button class="big" id="startMpBtn">Start Expedition</button><button class="big alt" id="leaveBtn">Leave Lobby</button></div>
  <div class="status" id="lobbyStatus"></div>
</div>

<div id="hud" class="hidden">
  <div class="pbars">
    <div class="pname" id="pName"></div>
    <div class="bar"><i id="hpChip"></i><i id="hpFill"></i><span id="hpTxt"></span></div>
    <div class="bar mana hidden" id="manaBar"><i id="manaFill"></i><span id="manaTxt"></span></div>
    <div class="flasks" id="flasks"></div>
    <div id="buffs"></div>
  </div>
  <div id="team"></div>
  <div id="lockTag"></div>
  <div id="specTag" class="hidden"></div>
  <div class="boss"><div class="name" id="bossName"></div><div class="bar"><i id="bChip"></i><i id="bFill"></i></div></div>
  <div id="skills"></div>
</div>
<div id="chargeWrap" class="hidden"><i id="chargeFill"></i></div>
<div id="tags"></div>
<div id="crosshair" class="hidden"></div>
<div id="vignette"></div>
<div id="hurtFx"></div>
<div id="center"><div class="t"></div><div class="s"></div></div>
<div id="toast"></div>

<div id="pause" class="screen hidden">
  <h1 style="font-size:46px">PAUSED</h1>
  <div class="sub" id="pauseNote"></div>
  <div class="ctrlTable" id="ctrlTable"></div>
  <button class="big" id="resumeBtn">Resume</button>
  <button class="big alt" id="pauseBindsBtn">Keybinds</button>
  <button class="big alt" id="quitBtn">Leave Expedition</button>
</div>

<div id="binds" class="screen hidden">
  <h2>Keybinds</h2>
  <div class="ctrlTable" id="bindTable"></div>
  <div class="sub" style="letter-spacing:.08em;font-size:12px;text-transform:none;font-family:Inter,sans-serif">Select an action, then press a key or mouse button. Press Escape to cancel. Bindings are saved in this browser.</div>
  <div class="row"><button class="big alt" id="bindReset">Reset to Defaults</button><button class="big" id="bindBack">Done</button></div>
</div>

<div id="end" class="screen hidden">
  <h1 id="endTitle">YOU HAVE FALLEN</h1>
  <div id="endStats"></div>
  <div class="row" id="endBtns"></div>
  <div class="status" id="endNote" style="color:#a99878"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const TAU=Math.PI*2;
const wrap=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const rand=(a,b)=>a+Math.random()*(b-a);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ARENA=24;
const CHARGE=.7;

// ==== DATA ====
const CLASSES={
  sword:{name:'Swordsman',hp:110,speed:6.8,desc:'A disciplined warrior with sword and shield. Blocks, parries and delivers crushing strikes.',
    skills:[{k:'LMB',n:'Slash Combo'},{k:'RMB',n:'Heavy Strike'},{k:'Shift',n:'Block / Parry'},{k:'Space',n:'Roll'}],
    ctrl:[['light','Light attack (3-hit combo)'],['heavy','Heavy attack'],['block','Block (hold), press just before impact to parry']]},
  mage:{name:'Mage',hp:85,speed:6.6,mana:120,support:true,desc:'A dedicated healer with no offensive magic. Mends allies from afar and shields the party. Multiplayer only.',
    skills:[{id:'mend',k:'LMB',n:'Mending Ray',cost:8,cd:.6},{id:'renew',k:'RMB',n:'Renew',cost:18,cd:3.5},{id:'sanct',k:'Q',n:'Sanctuary',cost:35,cd:12},{id:'burst',k:'E',n:'Healing Burst',cost:30,cd:8},{id:'ward',k:'F',n:'Arcane Ward',cost:30,cd:16}],
    ctrl:[['light','Mending Ray, heals the targeted ally from range (8 mana)'],['heavy','Renew, heals the targeted ally over time (18 mana)'],['q','Sanctuary, healing circle placed at the targeted ally (35 mana)'],['e','Healing Burst, large instant heal around you (30 mana)'],['f','Arcane Ward, nearby allies take reduced damage (30 mana)']]},
  archer:{name:'Archer',hp:95,speed:7.3,desc:'A ranged hunter with unlimited arrows. Rapid shots, heavy charged arrows and devastating volleys.',
    skills:[{id:'shot',k:'LMB',n:'Shot',cd:.5},{id:'charged',k:'RMB',n:'Charged Shot',cd:.55},{id:'triple',k:'Q',n:'Triple Shot',cd:4.5},{id:'rain',k:'E',n:'Arrow Rain',cd:12}],
    ctrl:[['light','Shoot arrow'],['heavy','Hold to charge (0.7s), full charge deals massive damage'],['q','Triple Shot, three heavy arrows at once'],['e','Arrow Rain on the target area']]},
  berserker:{name:'Berserker',hp:135,speed:6.4,desc:'A towering brute with a greataxe. Slow but durable, with crushing blows fuelled by bloodlust.',
    skills:[{k:'LMB',n:'Cleave'},{k:'RMB',n:'Crushing Blow'},{id:'whirl',k:'Q',n:'Whirlwind',cd:10},{id:'rage',k:'E',n:'Blood Rage',cd:22},{id:'leap',k:'F',n:'Leap Slam',cd:12}],
    ctrl:[['light','Cleave (wide alternating swings)'],['heavy','Crushing Blow, slow overhead strike'],['q','Whirlwind, spin through the boss for 2 seconds'],['e','Blood Rage, 40% more damage and lifesteal for 8 seconds'],['f','Leap Slam onto the boss (invulnerable in the air)']]},
  rogue:{name:'Rogue',hp:70,speed:7.4,desc:'A swift assassin with twin daggers. Strikes from the shadows and deals triple damage from behind.',
    skills:[{k:'LMB',n:'Dagger Flurry'},{id:'backstab',k:'RMB',n:'Backstab',cd:4},{id:'step',k:'Q',n:'Shadow Step',cd:12},{id:'poison',k:'E',n:'Envenom',cd:18},{id:'smoke',k:'F',n:'Smoke Bomb',cd:25}],
    ctrl:[['light','Dagger flurry (rapid chained stabs)'],['heavy','Backstab lunge, triple damage and a guaranteed stun from behind'],['q','Shadow Step, teleport behind the boss'],['e','Envenom, attacks apply poison for 6 seconds'],['f','Smoke Bomb, the boss loses track of you for a few seconds']]}
};

  Object.assign(moon.shadow.camera,{left:-R-6,right:R+6,top:R+6,bottom:-R-6,near:1,far:R*4});moon.shadow.camera.updateProjectionMatrix();

    c.fillStyle=th.grout;c.fillRect(0,0,w,h);const n=6,s=w/n;
    for(let y=0;y<n;y++)for(let x=-1;x<n;x++){const off=(y%2)*s/2;
      c.fillStyle=`hsl(${th.hue+rand(-12,12)},${th.sat}%,${th.l0+Math.random()*th.lr}%)`;c.fillRect(x*s+off+3,y*s+3,s-6,s-6);

    c.strokeStyle=th.cracks?'rgba(40,10,0,.9)':'rgba(0,0,0,.45)';c.lineWidth=th.cracks?3:1.5;
    cracks.slice(0,th.cracks?26:22).forEach(p=>{c.beginPath();c.moveTo(p[0][0],p[0][1]);p.forEach(q=>c.lineTo(q[0],q[1]));c.stroke();});
  },R/2.6,R/2.6);
  const fmat=new THREE.MeshStandardMaterial({map:floorTex,roughness:th.rough,metalness:th.metal});
  if(th.cracks){
    fmat.emissiveMap=canvasTex(512,512,(c,w,h)=>{c.fillStyle='#000';c.fillRect(0,0,w,h);c.strokeStyle='#ff6a18';c.lineWidth=2.2;c.shadowColor='#ff4a00';c.shadowBlur=6;
      cracks.slice(0,26).forEach(p=>{c.beginPath();c.moveTo(p[0][0],p[0][1]);p.forEach(q=>c.lineTo(q[0],q[1]));c.stroke();});},R/2.6,R/2.6);
    fmat.emissive=new THREE.Color(0xff5a10);fmat.emissiveIntensity=.55;
  }
  const floor=new THREE.Mesh(new THREE.CircleGeometry(R+(th.lava?.3:3),96).rotateX(-Math.PI/2),fmat);floor.receiveShadow=true;g.add(floor);
  const wallTex=canvasTex(512,256,(c,w,h)=>{c.fillStyle='#0a0809';c.fillRect(0,0,w,h);const bw=64,bh=32;
    for(let y=0;y<h/bh;y++)for(let x=-1;x<w/bw+1;x++){const off=(y%2)*bw/2;c.fillStyle=`hsl(${th.wallHue},${th.wallSat}%,${th.wl0+Math.random()*8}%)`;c.fillRect(x*bw+off+2,y*bh+2,bw-4,bh-4);}},Math.round(R/1.7),2);
  const wallR=R+(th.lava?5:2);
  const wall=new THREE.Mesh(new THREE.CylinderGeometry(wallR,wallR,18,96,1,true),new THREE.MeshStandardMaterial({map:wallTex,roughness:.95,side:THREE.BackSide}));
  wall.position.y=9;wall.receiveShadow=true;g.add(wall);
  if(th.lava){
    lavaMat=new THREE.MeshBasicMaterial({color:0xff4a08});
    const lava=new THREE.Mesh(new THREE.RingGeometry(R+.3,wallR+.5,96).rotateX(-Math.PI/2),lavaMat);lava.position.y=-.15;g.add(lava);
    const rim=new THREE.Mesh(new THREE.TorusGeometry(R+.2,.25,6,96).rotateX(Math.PI/2),new THREE.MeshStandardMaterial({color:0x1a1210,roughness:.9}));rim.position.y=.05;g.add(rim);
    const lavaLight=new THREE.PointLight(0xff4a10,1.2,R*2.2,1.2);lavaLight.position.set(0,1,0);g.add(lavaLight);
  }else{
    const ceil=new THREE.Mesh(new THREE.CircleGeometry(wallR+1,48).rotateX(Math.PI/2),new THREE.MeshStandardMaterial({color:0x08070a,roughness:1}));ceil.position.y=18;g.add(ceil);
  }
  for(const rr of [R*.42,R*.17]){const m=new THREE.MeshBasicMaterial({color:th.rune,transparent:true,opacity:.5});runeMats.push(m);
    const ring=new THREE.Mesh(new THREE.RingGeometry(rr-.35,rr,128).rotateX(-Math.PI/2),m);ring.position.y=.02;g.add(ring);}
  const stoneMat=new THREE.MeshStandardMaterial({color:th.snow?0x6a7a8a:th.lava?0x1e1614:th.voidp?0x241a30:0x2a252c,roughness:.9});
  if(th.voidp){const vm=new THREE.MeshStandardMaterial({color:0x2a1a3a,emissive:0x5a1a9a,emissiveIntensity:.5,roughness:.4});
    for(let i=0;i<18;i++){const a=Math.random()*TAU,r=R+rand(3,8);const c=new THREE.Mesh(new THREE.OctahedronGeometry(rand(.6,1.6)),vm);c.position.set(Math.sin(a)*r,rand(2,10),Math.cos(a)*r);c.rotation.set(rand(0,3),rand(0,3),0);g.add(c);}}
  const nP=Math.round(R/2);let lights=0;
  for(let i=0;i<nP;i++){
    const a=i/nP*TAU,r=wallR-.8;
    const p=new THREE.Mesh(new THREE.CylinderGeometry(1,1.2,18,10),stoneMat);p.position.set(Math.sin(a)*r,9,Math.cos(a)*r);p.castShadow=true;p.receiveShadow=true;g.add(p);
    if(i%2===0&&lights<8){lights++;
      const tr=r-1.3,tx=Math.sin(a)*tr,tz=Math.cos(a)*tr;
      const holder=new THREE.Mesh(new THREE.CylinderGeometry(.12,.08,.7,6),new THREE.MeshStandardMaterial({color:0x3a2a1a}));holder.position.set(tx,4.2,tz);g.add(holder);
      const flame=new THREE.Mesh(new THREE.SphereGeometry(.3,8,8),new THREE.MeshBasicMaterial({color:th.flame}));flame.position.set(tx,4.7,tz);g.add(flame);
      const light=new THREE.PointLight(th.torch,1.5,R*1.15,1.5);light.position.set(tx*.95,5,tz*.95);g.add(light);
      torches.push({flame,light,seed:Math.random()*10});}
  }
  for(let i=0;i<Math.round(R*1.1);i++){const a=Math.random()*TAU,r=R-rand(0,1.4);
    const m=new THREE.Mesh(new THREE.BoxGeometry(rand(.3,1),rand(.2,.6),rand(.3,1)),stoneMat);m.position.set(Math.sin(a)*r,.15,Math.cos(a)*r);m.rotation.set(rand(0,1),rand(0,3),rand(0,1));m.castShadow=true;g.add(m);}
  if(th.snow){const im=new THREE.MeshStandardMaterial({color:0xbfe8ff,emissive:0x2a6a9a,emissiveIntensity:.6,roughness:.15,metalness:.2,transparent:true,opacity:.9});
    for(let i=0;i<28;i++){const a=Math.random()*TAU,r=R-rand(.2,1.5);const c=new THREE.Mesh(new THREE.OctahedronGeometry(rand(.5,1.4)),im);c.position.set(Math.sin(a)*r,rand(.4,1.2),Math.cos(a)*r);c.scale.y=rand(1.5,3);c.rotation.set(rand(-.3,.3),rand(0,3),rand(-.3,.3));c.castShadow=true;g.add(c);}}
  const N=th.snow?900:th.lava?400:th.voidp?350:120,pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){const a=Math.random()*TAU,r=Math.sqrt(Math.random())*(R+2);pos[i*3]=Math.sin(a)*r;pos[i*3+1]=Math.random()*16;pos[i*3+2]=Math.cos(a)*r;}
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const pm=new THREE.PointsMaterial({color:th.snow?0xffffff:th.lava?0xff8a30:th.voidp?0xc07aff:0x8a7a6a,size:th.snow?.14:th.lava||th.voidp?.12:.06,transparent:true,opacity:th.snow?.85:.8,depthWrite:false});
  ambient={pts:new THREE.Points(pg,pm),N,dir:th.snow?-1:th.lava||th.voidp?1:.15,speed:th.snow?1.6:th.lava?1.4:th.voidp?.7:.2};g.add(ambient.pts);
}
function updateArena(dt,now){
  for(const t of torches){const f=.8+Math.sin(now*.012+t.seed)*.12+Math.sin(now*.031+t.seed*3)*.08;t.light.intensity=1.5*f;t.flame.scale.setScalar(f);}
  runeMats.forEach(m=>m.opacity=.35+Math.sin(now*.002)*.15+(B&&B.phase===2?.3:0));
  if(lavaMat){const k=.5+Math.sin(now*.002)*.5;lavaMat.color.setRGB(1,.25+k*.15,.02);}
  if(ambient){const a=ambient.pts.geometry.attributes.position,arr=a.array;
    for(let i=0;i<ambient.N;i++){arr[i*3+1]+=ambient.dir*ambient.speed*dt*(.6+(i%7)*.1);arr[i*3]+=Math.sin(now*.001+i)*dt*.3;
      if(arr[i*3+1]<0)arr[i*3+1]=16;if(arr[i*3+1]>16)arr[i*3+1]=0;}
    a.needsUpdate=true;}
}

let AC=null,noiseBuf=null;
function initAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f1,f2,dur,type,vol){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur);}
function noise(dur,freq,vol,q,type){if(!AC)return;if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q||1;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur);}

const parts=[],pGeo=new THREE.BoxGeometry(1,1,1),pMats={};
const pMat=c=>pMats[c]||(pMats[c]=new THREE.MeshBasicMaterial({color:c}));
function burst(x,y,z,n,color,speed,size,life,grav){
  if(grav===undefined)grav=14;
  for(let i=0;i<n&&parts.length<500;i++){const m=new THREE.Mesh(pGeo,pMat(color));const s=size*rand(.5,1);
    m.position.set(x,y,z);m.scale.setScalar(s);scene.add(m);const l=life*rand(.6,1);
    parts.push({m,vx:rand(-1,1)*speed,vy:rand(.2,1.2)*speed,vz:rand(-1,1)*speed,life:l,max:l,s,grav});}
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;
    if(p.life<=0){scene.remove(p.m);parts.splice(i,1);continue;}
    p.vy-=p.grav*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;
    if(p.m.position.y<0.05){p.m.position.y=0.05;p.vy*=-.3;p.vx*=.7;p.vz*=.7;}
    p.m.scale.setScalar(p.s*(p.life/p.max));p.m.rotation.x+=dt*5;p.m.rotation.y+=dt*4;}
}
const fx=[];
function addFx(o){o.t=0;fx.push(o);return o;}
function updateFx(dt){for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;if(f.update(dt,f.t/f.dur)===false||f.t>=f.dur){f.dispose&&f.dispose();fx.splice(i,1);}}}
function clearFx(){fx.forEach(f=>f.dispose&&f.dispose());fx.length=0;parts.forEach(p=>scene.remove(p.m));parts.length=0;}
let shakeAmt=0,hitstop=0,timeScale=1;
const shake=a=>{shakeAmt=Math.max(shakeAmt,a);};

function netConnect(){

    let ws;try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');}catch(e){return rej(e);}
    const to=setTimeout(()=>{rej(new Error('timeout'));try{ws.close();}catch(e){}},6000);
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(err){return;}
      if(m.t==='welcome'){NET.id=m.id;NET.ws=ws;clearTimeout(to);res();return;}onNet(m);};
    ws.onerror=()=>{clearTimeout(to);rej(new Error('fail'));};
    ws.onclose=()=>{if(NET.ws===ws){NET.ws=null;NET.room=null;onDisconnect();}};
  });
}
function onDisconnect(){

    else if(state==='lobby')renderLobby();

  if(m.t==='host'){const was=NET.isHost;NET.isHost=m.id===NET.id;if(NET.isHost&&!was&&state==='play'&&B&&!B.dead){B.action=null;B.queue=[];B.cool=1.2;B.air=false;B.y=0;toast('You are now the host of this expedition');}return;}

function shapeGeo(s){
  if(s.type==='circle')return new THREE.CircleGeometry(s.r,48).rotateX(-Math.PI/2);
  if(s.type==='arc'){const g=new THREE.RingGeometry(.01,s.r,48,1,-Math.PI/2-s.half,s.half*2);g.rotateX(-Math.PI/2);return g;}

}

function addDanger(s,o){

}
function inside(s,px,pz,pad){

  if(s.type==='arc'){const d=Math.hypot(dx,dz);if(d>s.r+pad)return false;if(d<1)return true;return Math.abs(wrap(Math.atan2(dx,dz)-s.a))<=s.half;}
  const sa=Math.sin(s.a),ca=Math.cos(s.a),along=dx*sa+dz*ca,side=dx*ca-dz*sa;

  }
}

function spawnProj(o){

    else if(p.kind==='arrowC'&&Math.random()<.5)burst(p.x,p.y,p.z,1,0xfff2b0,.5,.08,.3,0);
    let hit=false;
    if(!B.dead&&BM){const dx=p.x-B.x,dz=p.z-B.z,rr=B.r+(p.kind==='inferno'?.9:.35),by=BM.root.position.y;
      if(dx*dx+dz*dz<rr*rr&&p.y>by-.5&&p.y<by+G.boss.height)hit=true;}

function hurtPlayer(dmg,src){
  if(!P||P.dead||P.iframe>0||P.hurtInv>0)return;
  P.lastHit=gameTime;
  if(P.ward>0)dmg*=.55;
  if(P.state==='block'&&src.blockable){
    const ang=Math.atan2(src.x-P.x,src.z-P.z);
    if(Math.abs(wrap(ang-P.facing))<1.6){
      if(src.parry&&gameTime-P.blockStart<.22&&!B.air){
        stats.parries++;SFX.parry();hitstop=.12;shake(.4);
        burst(P.x+Math.sin(P.facing)*.8,1.5,P.z+Math.cos(P.facing)*.8,22,0x9fd8ff,7,.12,.5,6);
        floatText('PARRIED',P.x,2.8,P.z,'label');toHost('parry',{});P.hurtInv=.4;return;}
      dmg*=.2;SFX.block();burst(P.x+Math.sin(P.facing)*.7,1.3,P.z+Math.cos(P.facing)*.7,10,0xffd090,5,.1,.35);
      const ka=Math.atan2(P.x-src.x,P.z-src.z);P.kx=Math.sin(ka)*6;P.kz=Math.cos(ka)*6;P.hurtInv=.3;
      P.hp-=dmg;stats.taken+=dmg;if(P.hp<=0)killPlayer();return;}
  }

function damageBoss(dmg,poise,heavy,from,stun){

function allyTarget(keepId){

  if(keepId){if(keepId===me.id)return me;const k=L.find(t=>t.id===keepId);if(k)return k;}
  if(!L.length)return me;
  if(lockOn)return [me,...L].reduce((a,b)=>b.hp<a.hp?b:a);
  const a=Math.atan2(-Math.sin(cam.yaw),-Math.cos(cam.yaw));let best=null,bd=.65;
  L.forEach(t=>{const d=Math.abs(wrap(Math.atan2(t.x-P.x,t.z-P.z)-a));if(d<bd){bd=d;best=t;}});

  setScreen('end');$('end').classList.toggle('dead',!win);$('hud').classList.add('hidden');$('crosshair').classList.add('hidden');$('chargeWrap').classList.add('hidden');

  $('endTitle').textContent=win?'VICTORY ACHIEVED':(G.mode==='mp'?'THE PARTY HAS FALLEN':'YOU HAVE FALLEN');
  $('endStats').innerHTML=`${G.boss.n} · ${G.diff.n}<br>`+(win?`Time Elapsed: ${tm}`:`Boss Health Remaining: ${Math.round(B.hp/B.maxHp*100)}%<br>Time Survived: ${tm}`)+
    `<br>Damage Dealt: ${Math.round(stats.dealt)}<br>Damage Taken: ${Math.round(stats.taken)}<br>Flasks Consumed: ${stats.flasks}`+(stats.parries?`<br>Successful Parries: ${stats.parries}`:'');
  const btns=$('endBtns');$('endNote').textContent='';
  if(G.mode==='solo'){btns.innerHTML='<button class="big" id="againBtn">Try Again</button><button class="big alt" id="toMenuBtn">Main Menu</button>';
    $('againBtn').onclick=()=>startGame(G.cfg);$('toMenuBtn').onclick=toMenu;}
  else{btns.innerHTML=(NET.isHost?'<button class="big" id="toLobbyBtn">Return to Lobby</button>':'')+'<button class="big alt" id="leaveEndBtn">Leave Lobby</button>';
    if(NET.isHost)$('toLobbyBtn').onclick=()=>nsend({t:'toLobby'});else $('endNote').textContent='Waiting for the host to return to the lobby.';
    $('leaveEndBtn').onclick=()=>{nsend({t:'leave'});toMenu();};}
}
function leaveGame(){
  if(G&&G.mode==='mp'){nsend({t:'leave'});}
  toMenu();
}
function toMenu(){state='menu';try{document.exitPointerLock();}catch(e){}
  $('hud').classList.add('hidden');$('crosshair').classList.add('hidden');$('chargeWrap').classList.add('hidden');
  remotes.forEach(r=>{disposeModel(r.model);r.tag.remove();});remotes.clear();
  setScreen('menu');$('menuStatus').textContent='';renderClassCards();}

// ==== MENUS ====
function myName(){const v=$('nameIn').value.trim();return v||'Adventurer';}
try{const n=localStorage.getItem('hc_name');if(n)$('nameIn').value=n;const c=localStorage.getItem('hc_class');if(c&&CLASSES[c])myClass=c;}catch(e){}
$('nameIn').addEventListener('input',()=>{try{localStorage.setItem('hc_name',$('nameIn').value);}catch(e){}});
const ICONS={
  sword:'<svg viewBox="0 0 64 64"><path d="M32 4 L36 10 L36 40 L28 40 L28 10 Z" fill="#cfd6e0"/><rect x="20" y="40" width="24" height="4" fill="#b98a3a"/><rect x="30" y="44" width="4" height="12" fill="#5a3a22"/><circle cx="32" cy="58" r="3" fill="#b98a3a"/></svg>',
  mage:'<svg viewBox="0 0 64 64"><rect x="30" y="18" width="4" height="42" fill="#7a5a3a"/><polygon points="32,2 40,14 32,26 24,14" fill="#9fe0ff"/><circle cx="32" cy="14" r="3" fill="#fff"/><path d="M12 40 q6 -10 0 -18 M52 40 q-6 -10 0 -18" stroke="#8af0a0" stroke-width="2.5" fill="none"/></svg>',
  berserker:'<svg viewBox="0 0 64 64"><rect x="30" y="8" width="4" height="50" fill="#6a4a2a"/><path d="M34 10 Q54 18 50 34 Q44 26 34 26 Z" fill="#cfd6e0"/><path d="M30 10 Q10 18 14 34 Q20 26 30 26 Z" fill="#cfd6e0"/></svg>',
  rogue:'<svg viewBox="0 0 64 64"><g transform="rotate(35 32 32)"><rect x="30" y="6" width="4" height="30" fill="#d6dce6"/><rect x="25" y="36" width="14" height="3" fill="#8a2a3a"/><rect x="30" y="39" width="4" height="12" fill="#2a2026"/></g><g transform="rotate(-35 32 32)"><rect x="30" y="6" width="4" height="30" fill="#d6dce6"/><rect x="25" y="36" width="14" height="3" fill="#8a2a3a"/><rect x="30" y="39" width="4" height="12" fill="#2a2026"/></g></svg>',
  archer:'<svg viewBox="0 0 64 64"><path d="M18 6 Q50 32 18 58" stroke="#a87a4a" stroke-width="3.5" fill="none"/><line x1="18" y1="6" x2="18" y2="58" stroke="#e8e0c8" stroke-width="1"/><line x1="10" y1="32" x2="54" y2="32" stroke="#cfd6e0" stroke-width="2"/><path d="M56 32 L48 27 L48 37 Z" fill="#cfd6e0"/></svg>'
};
function renderClassCards(){
  $('classCards').innerHTML=Object.entries(CLASSES).map(([id,c])=>`<div class="card ${id===myClass?'sel':''}" data-c="${id}">${ICONS[id]}<h3>${c.name}</h3><p>${c.desc}</p><span class="tag">${c.hp} Health${c.mana?' · '+c.mana+' Mana':''}</span></div>`).join('');
  $('classCards').querySelectorAll('.card').forEach(el=>el.onclick=()=>{myClass=el.dataset.c;try{localStorage.setItem('hc_class',myClass);}catch(e){}renderClassCards();});
  $('classInfo').innerHTML=ctrlRows().map(r=>`<b>${esc(r[0])}</b> ${r[1]}`).join(' &nbsp;·&nbsp; ')+` &nbsp;·&nbsp; <b>${esc(keyName(BINDS.roll))}</b> Roll &nbsp;·&nbsp; <b>${esc(keyName(BINDS.heal))}</b> Flask`;
}
function fillSelects(b,a,d){
  b.innerHTML=Object.entries(BOSSES).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');
  a.innerHTML=Object.entries(ARENAS).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');
  d.innerHTML=Object.entries(DIFFS).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');d.value='normal';
}
fillSelects($('soloBoss'),$('soloArena'),$('soloDiff'));fillSelects($('lBoss'),$('lArena'),$('lDiff'));
function soloDesc(){const b=BOSSES[$('soloBoss').value],a=ARENAS[$('soloArena').value],d=DIFFS[$('soloDiff').value];$('soloDesc').innerHTML=`<b>${b.n}.</b> ${b.d}<br><b>${a.n}.</b> ${a.d}<br><b>${d.n}.</b> ${d.d}`;}
$('soloBoss').onchange=()=>{$('soloArena').value=BOSSES[$('soloBoss').value].arena;soloDesc();};$('soloArena').onchange=soloDesc;$('soloDiff').onchange=soloDesc;
$('soloBtn').onclick=()=>{initAudio();if(CLASSES[myClass].support){$('menuStatus').textContent='The Mage has no offensive abilities and cannot defeat a boss alone. Choose another class for solo play, or join allies in Multiplayer.';return;}state='solo';setScreen('solo');soloDesc();};
$('soloBack').onclick=toMenu;
$('soloStart').onclick=()=>startGame({mode:'solo',boss:$('soloBoss').value,arena:$('soloArena').value,diff:$('soloDiff').value});
$('mpBtn').onclick=async()=>{initAudio();$('menuStatus').textContent='Connecting to the server...';
  try{await netConnect();state='mp';setScreen('mp');$('mpStatus').textContent='';nsend({t:'list'});}
  catch(e){$('menuStatus').innerHTML='Multiplayer is only available on the hosted version: <a href="https://game-production-0587ac3d.up.railway.app" target="_blank" style="color:#f2c75a">game-production-0587ac3d.up.railway.app</a>';}};
$('mpBack').onclick=toMenu;
$('refreshBtn').onclick=()=>nsend({t:'list'});
$('createBtn').onclick=()=>nsend({t:'create',name:myName(),cls:myClass,public:$('pubChk').checked});
$('joinBtn').onclick=()=>{const c=$('codeIn').value.trim().toUpperCase();if(c.length<4){$('mpStatus').textContent='Enter a valid lobby code.';return;}nsend({t:'join',code:c,name:myName(),cls:myClass});};
$('codeIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('joinBtn').click();});
function renderLobbyList(list){
  const el=$('lobbyList');
  if(!list.length){el.innerHTML='<div class="empty">No open lobbies at the moment. Create one to begin.</div>';return;}
  el.innerHTML=list.map(l=>`<div class="lobbyItem"><div><b>${esc(l.hostName)}'s Lobby</b> <span class="meta">· ${l.count}/5 · ${esc(BOSSES[l.boss]?BOSSES[l.boss].n.split(',')[0]:'')} · ${esc(DIFFS[l.diff]?DIFFS[l.diff].n:'')}</span></div><button class="sm" data-code="${esc(l.code)}">Join</button></div>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>nsend({t:'join',code:b.dataset.code,name:myName(),cls:myClass}));
}
function showLobby(){state='lobby';try{document.exitPointerLock();}catch(e){}$('hud').classList.add('hidden');$('crosshair').classList.add('hidden');$('chargeWrap').classList.add('hidden');
  remotes.forEach(r=>{disposeModel(r.model);r.tag.remove();});remotes.clear();setScreen('lobby');$('lobbyStatus').textContent='';}
function renderLobby(){
  const r=NET.room;if(!r)return;const me=r.players.find(p=>p.id===NET.id);
  $('lobbyCode').textContent=r.code;$('pCount').textContent=r.players.length;
  let h='';for(let i=0;i<5;i++){const p=r.players[i];
    if(p)h+=`<div class="slot"><span class="nm">${esc(p.name)}${p.id===NET.id?' <span style="color:#8a806a">(You)</span>':''}</span><span class="cls">${CLASSES[p.cls].name}</span>${p.id===r.host?'<span class="crown">HOST</span>':`<span class="rdy ${p.ready?'on':''}">${p.ready?'Ready':'Not Ready'}</span>`}</div>`;
    else h+='<div class="slot emptySlot"><span class="nm">Open slot</span></div>';}
  $('slots').innerHTML=h;
  $('lobbyClasses').innerHTML=Object.entries(CLASSES).map(([k,c])=>`<button class="sm ${me&&me.cls===k?'on':''}" data-c="${k}">${c.name}</button>`).join('');
  $('lobbyClasses').querySelectorAll('button').forEach(b=>b.onclick=()=>{myClass=b.dataset.c;try{localStorage.setItem('hc_class',myClass);}catch(e){}nsend({t:'set',cls:myClass});});
  const host=r.host===NET.id;
  ['lBoss','lArena','lDiff'].forEach(id=>$(id).disabled=!host);
  $('lBoss').value=r.settings.boss;$('lArena').value=r.settings.arena;$('lDiff').value=r.settings.diff;
  const b=BOSSES[r.settings.boss],a=ARENAS[r.settings.arena],d=DIFFS[r.settings.diff];
  $('lobbyNote').innerHTML=`<b>${b.n}.</b> ${b.d}<br><b>${a.n}.</b> ${a.d}<br><b>${d.n}.</b> ${d.d}<br>Boss health scales with party size. Fallen players do not return until the expedition ends.`+(r.public?'':'<br>This lobby is private. Share the code to invite others.');
  $('readyBtn').classList.toggle('hidden',host);$('readyBtn').textContent=me&&me.ready?'Unready':'Ready';
  $('startMpBtn').classList.toggle('hidden',!host);
  const allReady=r.players.every(p=>p.id===r.host||p.ready);$('startMpBtn').disabled=!allReady;
  $('lobbyStatus').textContent=host?(allReady?'':'Waiting for all players to ready up.'):'Waiting for the host to start the expedition.';
}
function sendSettings(){nsend({t:'settings',settings:{boss:$('lBoss').value,arena:$('lArena').value,diff:$('lDiff').value}});}
$('lBoss').onchange=()=>{$('lArena').value=BOSSES[$('lBoss').value].arena;sendSettings();};$('lArena').onchange=sendSettings;$('lDiff').onchange=sendSettings;
$('readyBtn').onclick=()=>{const me=NET.room&&NET.room.players.find(p=>p.id===NET.id);nsend({t:'set',ready:!(me&&me.ready)});};
$('startMpBtn').onclick=()=>nsend({t:'start'});
$('leaveBtn').onclick=()=>{nsend({t:'leave'});toMenu();};
renderClassCards();

// ==== MENU BACKDROP ====
buildArena('keep');
G={boss:BOSSES.varkhul,diff:DIFFS.normal,arena:'keep',mode:'menu'};
BM=makeBossModel('warden');
B={x:0,z:-4,y:0,facing:0,r:1.9,phase:1,flash:0,pose:BM.pose,fade:1,dead:false,hp:1,maxHp:1};
PM=makePlayer('sword');
P={x:0,z:12,facing:Math.PI,state:'idle',dead:false};

// ==== LOOP ====
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min(.05,(now-last)/1000);last=now;const real=dt;
  updateArena(real,now);
  if(state==='play'&&G){
    const solo=G.mode==='solo';
    if(!(solo&&paused)){
      if(hitstop>0){hitstop-=dt;dt*=.06;}
      dt*=timeScale;gameTime+=real;
      updatePlayer(dt);updateRemotes(real);updateBoss(dt);updateDangers(dt);updateProjs(dt);updateZones(dt);updateFx(dt);updateParts(dt);
      applyPose(PM,PM.pose,P.state,dt,P.x,P.z,P.facing);setOpacity(PM,P.smoke>0?.3:1);
      netTick(real);
      const spec=updateCamera(real);updateFloats(real);updateHUD(spec);
      hurtFlash=Math.max(0,hurtFlash-real*2.5);hurtFx.style.opacity=Math.max(hurtFlash,!P.dead&&P.hp<P.maxHp*.3?.35+Math.sin(now*.006)*.15:0);
      if(endTimer>0){endTimer-=real;if(endTimer<=0)endGame(B.dead);}
    }
  }else if(state!=='play'){
    const a=now*.00012;camera.position.set(Math.sin(a)*16,6,Math.cos(a)*16);camera.lookAt(0,3,-4);
    if(BM&&B&&state!=='end'){B.pose.armR=-.35;applyBossPose(real);}
    if(PM&&P&&state!=='end'){PM.pose.armR=-.5;applyPose(PM,PM.pose,'idle',real,P.x||0,P.z||12,P.facing||Math.PI);}
    if(state==='end'&&G&&G.mode){updateBoss(real);updateParts(real);updateFx(real);}
  }
  if(centerT>0){centerT-=real;if(centerT<=0)centerEl.style.opacity=0;}
  if(toastT>0){toastT-=real;if(toastT<=0)$('toast').style.opacity=0;}
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
window.__hc={get P(){return P},get B(){return B},get G(){return G},get NET(){return NET},remotes,startGame,startAction:(n)=>{B.action=null;B.queue=[];startAction(n)},damageBoss:(d)=>damageBoss(d,0,false),get state(){return state},get endTimer(){return endTimer},get centerT(){return centerT}};
})();
</script>
